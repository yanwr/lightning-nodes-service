[package]
name = "lightning-nodes-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9" }
chrono = { version = "0.4.45" }
dotenvy = { version = "0.15.7" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = "0.5.2"
reqwest-tracing = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "macros", "migrate"] }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = "0.7.0"
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.25.0", features = ["v7"]}

[dev-dependencies]
temp-env = { version = "0.3.6" }
test-context = { version = "0.5.8" }
testcontainers = { version = "0.27.2" }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
wiremock = { version = "0.6.5" }
