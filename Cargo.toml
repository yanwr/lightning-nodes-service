[package]
name = "lightning-nodes-service"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45" }
dotenvy = { version = "0.15.7" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "macros", "migrate"] }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
temp-env = { version = "0.3.6" }
